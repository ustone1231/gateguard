name: Backend CI

on:
  push:
    branches: [main, develop, backend]
    paths:
      - "apps/backend/**"
      - "packages/schema/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop, backend]
    paths:
      - "apps/backend/**"
      - "packages/schema/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
