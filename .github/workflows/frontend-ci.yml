    branches: [main]
    paths:
      - "apps/frontend/**"
      - "packages/schema/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "packages/schema/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
