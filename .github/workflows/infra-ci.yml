name: Infra CI

on:
  push:
    branches: [main]
    paths:
      - "apps/infra/**"
      - "docker-compose*.yml"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "apps/infra/**"
      - "docker-compose*.yml"
      - ".github/workflows/infra-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.dev.yml
        run: docker compose -f docker-compose.dev.yml config --quiet

      # TODO: terraform fmt/validate, hadolint Dockerfile 등 추가
