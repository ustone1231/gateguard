# GateGuard dev 환경 — 4트랙 통합 실행 (stub)
#
# 인프라 트랙이 채울 자리. 각 트랙이 Dockerfile을 본인 폴더에 만들면
# 여기서 build / depends_on 으로 묶어서 한 번에 띄움.
#
# 사용:
#   docker compose -f docker-compose.dev.yml up
#
services:
  # ─── AI 워커 ────────────────────────────────────────
  ai:
    build:
      context: ./apps/ai
      dockerfile: ../infra/Dockerfile.ai
      args:
        INSTALL_MIVOLO_RUNTIME: ${INSTALL_MIVOLO_RUNTIME:-0}
        MIVOLO_REF: ${MIVOLO_REF:-main}
    image: gateguard-ai:dev
    container_name: gateguard-ai
    volumes:
      - ./apps/ai/config:/app/config:ro
      - ./apps/ai/models:/app/models
      - ./videos:/videos
      - ./apps/ai/runs:/app/runs
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_DIR=/app/models
      - HF_HOME=/app/models/huggingface
      # AI HttpPublisher 우선순위: BACKEND_URL env > pipeline.json http_endpoint > localhost:8000
      # base URL 만 전달 — path(/api/v1/events)는 AI 코드에서 결합 (이슈 #3 합의)
      - BACKEND_URL=http://backend:8000
      - AI_SERVICE_TOKEN=dev-ai-service-token-please-change-32
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      backend:
        condition: service_healthy

  # ─── 백엔드 API ─────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
    image: gateguard-backend:dev
    container_name: gateguard-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://gateguard:gateguard@db:5432/gateguard
      - AI_SERVICE_TOKEN=dev-ai-service-token-please-change-32
      - AFC_SERVICE_TOKEN=dev-afc-service-token-please-change-32
      - JWT_SECRET=dev-jwt-secret-please-change-before-prod
      - STORAGE_BACKEND=sql
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # ─── 프론트 ────────────────────────────────────────
  frontend:
    # build:
    #   context: ./apps/frontend
    image: gateguard-frontend:dev
    container_name: gateguard-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    # TODO: 프론트 스택 결정 후 채움

  # ─── DB ────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: gateguard-db
    environment:
      - POSTGRES_USER=gateguard
      - POSTGRES_PASSWORD=gateguard
      - POSTGRES_DB=gateguard
    ports:
      - "5432:5432"
    volumes:
      - gateguard_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateguard -d gateguard"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Redis (Celery 큐, WebSocket) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: gateguard-redis
    ports:
      - "6379:6379"

volumes:
  gateguard_db_data:
